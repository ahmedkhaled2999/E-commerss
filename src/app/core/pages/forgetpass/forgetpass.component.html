<div class="w-full h-full flex justify-center items-center">
  <div class=" w-full">
    <h1 class="text-3xl mb-3 text-gre">{{pagesteps}}</h1>
    @if (steps ==1 ) {

    <form
      [formGroup]="verfiyEmail"
      (ngSubmit)="emailsubmit(verfiyEmail)"
      class="mx-auto w-full"
    >
      <div class="relative z-0 w-full mb-4 group">
        <input
          formControlName="email"
          type="email"
          name="floating_email"
          id="floating_email"
          class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-green-500 focus:outline-none focus:ring-0 focus:border-green-600 peer"
          placeholder=" "
          required
        />
        <label
          for="floating_email"
          class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-green-600 peer-focus:dark:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >Email address</label
        >
      </div>
      <div class="text-end">
        <button class="bg-green-400 p-2 rounded-lg uppercase text-white">
          sen email
        </button>
      </div>
    </form>

    }

    <!-- 000000000000000000000000000000000000000 -->
    @if (steps ==2 ) {

    <form
      [formGroup]="verfiyCode"
      (ngSubmit)="codesubmit(verfiyCode)"
      class="mx-auto"
    >
      <div class="relative z-0 w-full mb-4 group">
        <input
          formControlName="resetCode"
          type="text"
          name="floating_code"
          id="floating_code"
          class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-green-500 focus:outline-none focus:ring-0 focus:border-green-600 peer"
          placeholder=" "
          required
        />
        <label
          for="floating_code"
          class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-green-600 peer-focus:dark:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >code address</label
        >
      </div>
      <div class="text-end">
        <button class="bg-green-400 p-2 rounded-lg uppercase text-white">
          sen email
        </button>
      </div>
    </form>

    }

    <!-- 0-000000000000000000000000000000000000 -->
    @if(steps == 3){

    <form
      [formGroup]="resetpassword"
      (ngSubmit)="restsubmit(resetpassword)"
      class="mx-auto"
    >
      <div class="relative z-0 w-full mb-4 group">
        <input
          formControlName="email"
          type="email"
          name="floating_email"
          id="floating_email"
          class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-green-500 focus:outline-none focus:ring-0 focus:border-green-600 peer"
          placeholder=" "
          required
        />
        <label
          for="floating_email"
          class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-green-600 peer-focus:dark:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >Email address</label
        >
      </div>
      <div class="relative z-0 w-full mb-4 group">
        <input
          formControlName="newPassword"
          type="password"
          name="floating_password"
          id="floating_password"
          class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-green-500 focus:outline-none focus:ring-0 focus:border-green-600 peer"
          placeholder=" "
          required
        />
        <label
          for="floating_password"
          class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-green-600 peer-focus:dark:text-green-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6"
          >password address</label
        >
      </div>
      <div class="text-end">
        <button class="bg-green-400 p-2 rounded-lg uppercase text-white">
          sen email
        </button>
      </div>
    </form>

    }
  </div>
</div>
