<div class="flex flex-wrap justify-center items-center">
  @for (item of allgategry; track $index) {
  <div class="w-1/2 md:w-1/3 lg:w-1/5 p-3" [routerLink]="'/gategoriesdetails/'+item._id">
    <div class="rounded-lg shadow-sm shadow-green-500 overflow-hidden box">
      <div>
        <img [src]="item.image" class="h-[300px] w-full object-cover" alt="" />
      </div>
      <div class="text-center p-1">
        {{ item.name }}
      </div>
    </div>
  </div>
  }
</div>
