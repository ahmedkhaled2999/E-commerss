<div class="flex justify-between items-center border-b-2" >
  <div class="flex w-1/2">
    <div class="w-2/3 md:w-1/2">
      <img
        [src]="wish.imageCover"
        class="h-[200PX] md:h-[350px] w-full object-cover"
        alt=""
      />
    </div>
    <div class="flex justify-start items-center ms-5 w-1/3 md:w-1/2">
      <div>
        <h2 class="font-bold">
          {{ wish.title.split(" ").slice(0, 3).join(" ") }}
        </h2>
        <span class="block text-green-400 mb-4">{{
          wish.price | currency : "egp"
        }}</span>
        <span><i (click)="deleteWhish(wish.id)" class="fa-solid fa-trash text-red-600"></i></span>
      </div>
    </div>
  </div>

  <div class="w-1/2 text-end">
    <button
      (click)="addcartwhish(wish.id)"
      class="text-white p-2 uppercase me-4 text rounded-lg hover:bg-green-500 transition-all bg-green-300"
    >
      add to cart
    </button>
  </div>
</div>
